version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tanna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tanna
      POSTGRES_PASSWORD: tanna_dev_password
      POSTGRES_DB: tanna_dev
    ports:
      - "5432:5432"
    volumes:
      - tanna_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanna -d tanna_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tanna_postgres_data:
    driver: local
